<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Small puzzle games that work offline." />
    <meta name="robots" content="noindex" />
    <title>Games</title>
    <link rel="icon" href="./icons/colorsort-192.png" />
    <meta name="theme-color" content="#101a2e" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        color-scheme: dark light;
        --bg: #101a2e;
        --surface: #1b2a45;
        --text: #eef3fb;
        --text-dim: #93a4c4;
        --accent: #4da3ff;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #eef2f9;
          --surface: #ffffff;
          --text: #16233c;
          --text-dim: #5d6c88;
          --accent: #1f6feb;
        }
      }

      body {
        margin: 0;
        min-height: 100dvh;
        padding: max(28px, env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
        color: var(--text);
        background:
          radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, var(--accent) 12%, var(--bg)) 0%, transparent 60%),
          var(--bg);
        -webkit-tap-highlight-color: transparent;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 6vw, 2rem);
        letter-spacing: -0.02em;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        width: min(26rem, 100%);
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      a.card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 18px 10px 16px;
        border-radius: 20px;
        background: var(--surface);
        color: inherit;
        text-decoration: none;
        box-shadow: 0 2px 14px rgba(6, 12, 24, 0.22);
        transition: transform 0.15s ease;
      }

      /* "This one needs somebody else." Absolutely positioned so a card that
         carries it is still exactly the same size as one that does not —
         the grid would otherwise go uneven for a badge. */
      .two-up {
        position: absolute;
        top: 9px;
        right: 9px;
        display: grid;
        place-items: center;
        width: 27px;
        height: 21px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
      }

      .two-up svg {
        width: 15px;
        height: 15px;
        fill: currentColor;
      }

      a.card:active {
        transform: scale(0.97);
      }

      li {
        position: relative;
      }

      /* Pin. A sibling of the card rather than inside it, because a button
         nested in a link is invalid and taps would fall through to the game.
         Top-left, since top-right already belongs to the two-player badge. */
      .pin {
        position: absolute;
        top: 3px;
        left: 3px;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: none;
        color: var(--text-dim);
        opacity: 0.45;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .pin svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linejoin: round;
      }

      .pin[aria-pressed='true'] {
        color: var(--accent);
        opacity: 1;
      }

      .pin[aria-pressed='true'] svg {
        fill: currentColor;
      }

      .pin:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -4px;
      }

      a.card img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }

      a.card b {
        font-size: 0.95rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>

    <script>
      // Pinned games float to the top, in the grid's own order. Runs before
      // first paint so a pinned card never visibly jumps into place. The list
      // is a device-local preference, so localStorage alone is enough here —
      // losing it costs a few taps, not progress.
      (function () {
        var KEY = 'tf-games:pinned';
        var STAR =
          '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
          '<path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg>';

        var list = document.querySelector('ul');
        var items = Array.prototype.slice.call(list.children);

        function load() {
          try {
            var saved = JSON.parse(localStorage.getItem(KEY) || '[]');
            return Array.isArray(saved) ? saved : [];
          } catch (e) {
            return [];
          }
        }

        function save(pinned) {
          try {
            localStorage.setItem(KEY, JSON.stringify(pinned));
          } catch (e) {
            // Private mode or a full quota: the pin still holds until reload.
          }
        }

        var pinned = load();

        function slugOf(li) {
          return li.querySelector('a.card').getAttribute('href').replace(/^\.\/|\/$/g, '');
        }

        function render() {
          var top = [];
          var rest = [];
          items.forEach(function (li) {
            var on = pinned.indexOf(slugOf(li)) !== -1;
            var button = li.querySelector('.pin');
            button.setAttribute('aria-pressed', String(on));
            button.setAttribute('aria-label', (on ? 'Unpin ' : 'Pin ') + li.querySelector('b').textContent);
            (on ? top : rest).push(li);
          });
          top.concat(rest).forEach(function (li) {
            list.appendChild(li);
          });
        }

        items.forEach(function (li) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'pin';
          button.innerHTML = STAR;
          button.addEventListener('click', function () {
            var slug = slugOf(li);
            var at = pinned.indexOf(slug);
            if (at === -1) pinned.push(slug);
            else pinned.splice(at, 1);
            save(pinned);
            // Animate the reshuffle where supported, so it reads as the card
            // moving rather than the grid changing under the finger.
            if (document.startViewTransition) document.startViewTransition(render);
            else render();
          });
          li.appendChild(button);
          li.style.viewTransitionName = 'game-' + slugOf(li);
        });

        render();
      })();
    </script>

    <script>
      // Inline and dependency-free on purpose: the launcher emits no JS chunk,
      // so the worker's shell list stays a fixed set of unhashed URLs.
      // Skipped on the Vite dev server (see server.port in vite.config.ts),
      // where a stale cache makes local edits look like they never applied.
      if ('serviceWorker' in navigator && location.port !== '5273') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {
            // Offline play is a bonus, not a requirement. Never block the grid on it.
          });
        });
      }
    </script>

    <!-- Downloads every game in the background, so opening the grid is
         enough to have all of them offline. Shared verbatim with the
         games, which load it too: any page arms the lot. -->
    <script src="/warm.js" defer></script>
  </body>
</html>
