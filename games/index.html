<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Small puzzle games that work offline." />
    <meta name="robots" content="noindex" />
    <title>Games</title>
    <link rel="icon" href="./icons/colorsort-192.png" />
    <meta name="theme-color" content="#101a2e" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        color-scheme: dark light;
        --bg: #101a2e;
        --surface: #1b2a45;
        --text: #eef3fb;
        --text-dim: #93a4c4;
        --accent: #4da3ff;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #eef2f9;
          --surface: #ffffff;
          --text: #16233c;
          --text-dim: #5d6c88;
          --accent: #1f6feb;
        }
      }

      body {
        margin: 0;
        min-height: 100dvh;
        padding: max(28px, env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
        color: var(--text);
        background:
          radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, var(--accent) 12%, var(--bg)) 0%, transparent 60%),
          var(--bg);
        -webkit-tap-highlight-color: transparent;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 6vw, 2rem);
        letter-spacing: -0.02em;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        width: min(26rem, 100%);
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      a.card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 18px 10px 16px;
        border-radius: 20px;
        background: var(--surface);
        color: inherit;
        text-decoration: none;
        box-shadow: 0 2px 14px rgba(6, 12, 24, 0.22);
        transition: transform 0.15s ease;
      }

      a.card:active {
        transform: scale(0.97);
      }

      a.card img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }

      a.card b {
        font-size: 0.95rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Games</h1>

    <ul>
      <li>
        <a class="card" href="./colorsort/">
          <img src="./icons/colorsort-192.png" alt="" />
          <b>Color Sort</b>
        </a>
      </li>
      <li>
        <a class="card" href="./screwland/">
          <img src="./icons/screwland-192.png" alt="" />
          <b>Screw Land</b>
        </a>
      </li>
      <li>
        <a class="card" href="./busjam/">
          <img src="./icons/busjam-192.png" alt="" />
          <b>Bus Jam</b>
        </a>
      </li>
      <li>
        <a class="card" href="./fivedice/">
          <img src="./icons/fivedice-192.png" alt="" />
          <b>Five Dice</b>
        </a>
      </li>
      <li>
        <a class="card" href="./gridlock/">
          <img src="./icons/gridlock-192.png" alt="" />
          <b>Gridlock</b>
        </a>
      </li>
      <li>
        <a class="card" href="./depot/">
          <img src="./icons/depot-192.png" alt="" />
          <b>Depot</b>
        </a>
      </li>
      <li>
        <a class="card" href="./survival/">
          <img src="./icons/survival-192.png" alt="" />
          <b>Survival</b>
        </a>
      </li>
    </ul>

    <script>
      // Inline and dependency-free on purpose: the launcher emits no JS chunk,
      // so the worker's shell list stays a fixed set of unhashed URLs.
      // Skipped on the Vite dev server (see server.port in vite.config.ts),
      // where a stale cache makes local edits look like they never applied.
      if ('serviceWorker' in navigator && location.port !== '5273') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {
            // Offline play is a bonus, not a requirement. Never block the grid on it.
          });
        });
      }
    </script>

    <!-- Downloads every game in the background, so opening the grid is
         enough to have all of them offline. Shared verbatim with the
         games, which load it too: any page arms the lot. -->
    <script src="/warm.js" defer></script>
  </body>
</html>
